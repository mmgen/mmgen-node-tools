[build-system]
requires = [
	"setuptools>=57",
	"build>=0.5.1",
	"wheel>=0.36.0",
]
build-backend = "setuptools.build_meta"

[tool.bandit]
exclude_dirs = ["test/overlay/tree"]
skips = [
	# severity level low:
	"B101", # assert_used
	"B404", # import_subprocess (blacklist)
	"B603", # subprocess - check for execution of untrusted input
]

[tool.ruff]
line-length = 106
indent-width = 4

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"

[tool.ruff.lint]
ignore = [
	"E722",    # bare except
	"N999",    # Invalid module name
	"I001",    # Import block is un-sorted or un-formatted
	"RUF012",  # Mutable default value for class attribute
	"SIM102",  # Use a single `if` statement instead of nested `if` statements
	"UP032",   # Use f-string instead of `format` call
	"B006",    # Do not use mutable data structures for argument defaults
	"UP031",   # Use format specifiers instead of percent format
	"BLE001",  # Do not catch blind exception: `Exception`
	"S110",    # `try`-`except`-`pass` detected, consider logging the exception
	"ISC004",  # Unparenthesized implicit string concatenation in collection
]

[tool.ruff.lint.per-file-ignores]
"test/overlay/tree/*"        = [ "ALL" ]
"test/*" = [
	"SIM115",   # open() with context manager
]

[tool.pylint.format]
indent-string = "\t"
indent-after-paren = 2
max-line-length = 106

[tool.pylint.main]
recursive = true
errors-only = true
jobs = 0
ignore = [
	"data",
]

[tool.pylint."messages control"]
disable = [
	"no-method-argument",
	"possibly-used-before-assignment",
	"no-member",
]

[tool.pylint.miscellaneous]
notes = ["FIXME", "TODO", "DEBUG", "WIP", "NB"]
